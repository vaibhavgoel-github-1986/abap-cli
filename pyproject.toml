[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abap-cli"
version = "1.0.0"
description = "Bulk export/import of ABAP objects between SAP and a local folder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Goel" }]
keywords = ["sap", "abap", "abapgit", "cli"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "keyring>=24.0",
]

[project.scripts]
abap = "abap_cli.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/abap_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
